<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>스페이스기전 독 패널</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="dock-tones.css">
  <link rel="stylesheet" href="popover.css">
  <script src="dock-items.js" defer></script>
  <script src="popover.js" defer></script>
  <script src="captures.js" defer></script>
</head>
<body data-side="bottom">
<section id="card" class="card" role="dialog" aria-labelledby="title" hidden>
  <header class="head">
    <span id="mark" class="mark" aria-hidden="true"></span>
    <div class="titles"><h1 id="title"></h1><p id="sub"></p><p id="summary" hidden></p></div>
    <button id="add" class="pill" hidden>＋ 새 메모</button>
    <button id="new-capture" class="pill" hidden title="화면의 일부를 잘라 보관함에 담습니다">＋ 새 캡처</button>
    <button id="open-folder" class="icon" hidden aria-label="캡처 폴더 열기" title="캡처 폴더 열기"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg></button>
    <button id="clip-pause" class="icon" hidden aria-pressed="false" aria-label="기록 멈추기" title="기록 멈추기"><svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg></button>
    <div id="views" class="seg" role="tablist" aria-label="보기" hidden></div>
    <button id="refresh" class="icon" aria-label="새로고침" title="새로고침"><svg viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M5.5 7a7 7 0 0 1 12-2l2.5 3M4 16l2.5 3a7 7 0 0 0 12-2"/></svg></button>
    <button id="close" class="icon" aria-label="닫기" title="닫기 (Esc)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </header>
  <div id="body" class="body" aria-live="polite"></div>
  <!-- 클립보드 기록 — 찾기 칸은 그대로 두고 목록만 바꿔 그린다 (쓰는 중에 칸이 날아가지 않게) -->
  <div id="clips-view" class="clips" hidden>
    <label class="clip-search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></svg>
      <input id="clip-q" type="search" placeholder="복사한 글·파일 이름 찾기" aria-label="클립보드 기록 찾기" autocomplete="off"></label>
    <div id="clip-list" class="clip-list"></div>
  </div>
  <!-- 메시지 (학생 ↔ 선생님) — 목록만 다시 그리고 쓰는 칸은 그대로 둔다 (새로고침에 쓰던 글이 날아가지 않게) -->
  <div id="msg-view" class="msgs" hidden>
    <div id="msg-top" class="msg-top"></div>
    <div id="msg-list" class="msg-list"></div>
    <!-- 사진 크게 보기 (2026-10-22) — 대화의 사진을 누르면 패널 안에 크게. 원본은 캡처 보관함에 있다 -->
    <div id="msg-viewer" class="msg-viewer" hidden role="dialog" aria-label="사진 크게 보기">
      <img id="msg-viewer-img" alt="">
      <button class="viewer-nav prev" data-viewer="prev" aria-label="이전 사진" title="이전 사진 (←)">‹</button>
      <button class="viewer-nav next" data-viewer="next" aria-label="다음 사진" title="다음 사진 (→)">›</button>
      <div class="viewer-bar"><span id="msg-viewer-count"></span>
        <button class="pill" data-viewer="app" title="Windows 사진 앱으로 원래 크기로 엽니다">사진 앱으로 열기</button>
        <button class="viewer-close" data-viewer="close" aria-label="닫기" title="닫기 (Esc)">×</button></div>
    </div>
    <div id="msg-session" class="msg-session" hidden></div>
    <form id="msg-compose" class="msg-compose" hidden autocomplete="off">
      <div id="msg-pics" class="msg-pics" hidden></div>
      <textarea id="msg-text" rows="2" maxlength="1000" placeholder="메시지를 쓰세요 (Ctrl+Enter 보내기 · 사진은 붙여넣기·끌어 놓기)" aria-label="메시지 내용"></textarea>
      <div class="msg-send"><span class="msg-tools"><button id="msg-attach" type="button" class="icon" aria-label="사진 넣기" title="사진 넣기 (붙여넣기·끌어 놓기도 됩니다)"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-8 8"/></svg></button><input id="msg-file" type="file" accept="image/*" multiple hidden><span id="msg-count" class="hint">0/1000</span></span><button id="msg-go" type="submit" class="pill">보내기</button></div>
    </form>
  </div>
  <!-- 캡처 보관함 — captures.js 가 그린다 (제 창 captures.html 과 같은 코드) -->
  <div id="captures-view" class="cap" hidden>
    <div id="board" tabindex="0" aria-label="캡처 목록. 화살표로 고르고 Enter 로 엽니다">
      <div id="groups"></div>
      <div id="empty" class="empty" hidden><strong>아직 캡처가 없습니다</strong><span>‘＋ 새 캡처’를 누르고 화면에서 담을 곳을 고르면<br>여기에 차곡차곡 쌓입니다.</span></div>
    </div>
  </div>
  <footer id="foot" class="foot"><button id="more" class="link"></button><span id="hint" class="hint" hidden>끌어서 다른 프로그램에 놓기 · 두 번 눌러 열기 · F2 이름 바꾸기 · Delete 휴지통</span></footer>
</section>
<span id="caret" class="caret" aria-hidden="true"></span>
<div id="menu" role="menu" hidden>
  <button role="menuitem" data-do="open">열기</button>
  <button role="menuitem" data-do="copy">복사</button>
  <button role="menuitem" data-do="rename" data-one>이름 바꾸기</button>
  <button role="menuitem" data-do="reveal" data-one>파일 위치 열기</button>
  <hr>
  <button role="menuitem" data-do="delete" class="danger">휴지통으로 옮기기</button>
</div>
<div id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
